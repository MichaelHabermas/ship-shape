services:
  - type: web
    name: ship-shape-api
    runtime: node
    plan: starter
    buildCommand: CI=true pnpm install --frozen-lockfile && pnpm build:api && pnpm --filter @ship/api exec node dist/db/migrate.js
    startCommand: pnpm --filter @ship/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENVIRONMENT
        value: render
      - key: DATABASE_URL
        fromDatabase:
          name: ship-shape-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://ship-shape-web.onrender.com
      - key: APP_BASE_URL
        value: https://ship-shape-web.onrender.com
      - key: CDN_DOMAIN
        value: ship-shape-web.onrender.com
      - key: AWS_REGION
        value: us-east-1
      - key: HOST
        value: 0.0.0.0
      - key: FLEETGRAPH_WORKER_ENABLED
        value: "true"
      - key: FLEETGRAPH_WORKER_INTERVAL_MS
        value: "120000"
      - key: FLEETGRAPH_MANUAL_RUN_API_ENABLED
        value: "true"
      # Controlled proof path only; graph policy remains deterministic unless model-backed copy is needed.
      - key: FLEETGRAPH_REAL_MODEL_ENABLED
        value: "true"
      - key: FLEETGRAPH_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: LANGSMITH_TRACING
        value: "false"
      - key: LANGCHAIN_TRACING_V2
        value: "false"
      - key: FLEETGRAPH_EXTERNAL_TRACING_ENABLED
        value: "false"
      - key: LANGSMITH_PROJECT
        value: ship-shape-fleetgraph
      - key: LANGSMITH_ENDPOINT
        value: https://api.smith.langchain.com
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        value: https://us.cloud.langfuse.com
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_TRACING_ENVIRONMENT
        value: production

  - type: web
    name: ship-shape-web
    runtime: static
    buildCommand: CI=true pnpm install --frozen-lockfile && pnpm build:shared && pnpm --filter @ship/web exec tsc && VITE_API_URL=https://ship-shape-api.onrender.com VITE_WS_URL=https://ship-shape-api.onrender.com VITE_APP_ENV=production pnpm --filter @ship/web exec vite build
    staticPublishPath: ./web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_APP_ENV
        value: production
      - key: VITE_API_URL
        value: https://ship-shape-api.onrender.com
      - key: VITE_WS_URL
        value: https://ship-shape-api.onrender.com

  - type: web
    name: ship-shape-reviewer-evidence
    runtime: static
    buildCommand: CI=true pnpm install --frozen-lockfile && pnpm submission:render-bundle
    staticPublishPath: ./my-docs/project-weeks-sot/week-4/reviewer-evidence-bundle

databases:
  - name: ship-shape-db
    databaseName: ship_shape
    user: ship_shape
    plan: basic-256mb
    postgresMajorVersion: "15"
