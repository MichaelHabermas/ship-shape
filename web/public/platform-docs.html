<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plugforge Public API Reference • ShipShape</title>
    <style>
      body { margin:0; font-family: system-ui, -apple-system, sans-serif; }
      #redoc { height: 100vh; }
      .header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: #111; color: #ddd; padding: 8px 12px; font-size: 13px; display: flex; align-items: center; gap: 12px; }
      .header input { flex: 1; max-width: 520px; font-family: monospace; padding: 4px 8px; border: 1px solid #444; background: #1a1a1a; color: #ddd; }
      .header button { padding: 4px 10px; }
      .header a { color: #8ec5ff; }
    </style>
    <!-- Redoc standalone (no build step) -->
    <script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
  </head>
  <body>
    <div class="header">
      <strong>Plugforge Public API</strong>
      <span style="opacity:.6">— generated from code, never hand-written</span>
      <input id="spec-url" value="" placeholder="Full URL to openapi.json, e.g. http://localhost:3000/api/v1/openapi.json" />
      <button id="load">Load</button>
      <button id="btn-local" title="Standard local dev (API on 3000)">Local</button>
      <button id="btn-deployed" title="Render deployed API">Deployed</button>
      <button id="btn-proxy" title="Relative /api path (works when page is served by Vite web server that proxies /api)">Via proxy</button>
      <a href="https://ship-shape-api.onrender.com/api/v1/openapi.json" target="_blank">direct</a>
      <span style="margin-left:auto; opacity:.5; font-size:11px;">Plugforge Week 6 • /api/v1 only • API server must be running separately</span>
    </div>
    <div id="redoc" style="padding-top:40px;"></div>

    <script>
      const LOCAL_SPEC = 'http://localhost:3000/api/v1/openapi.json';
      const DEPLOYED_SPEC = 'https://ship-shape-api.onrender.com/api/v1/openapi.json';

      function defaultSpecUrl() {
        const host = location.hostname;
        if (host === 'localhost' || host === '127.0.0.1') return LOCAL_SPEC;
        if (host.endsWith('.onrender.com')) return DEPLOYED_SPEC;
        return DEPLOYED_SPEC;
      }

      function getSafeInitialUrl(raw) {
        let u = (raw || '').trim();
        if (!u) u = defaultSpecUrl();
        // On first load (especially when this HTML is opened via Live Server on 5501,
        // file://, another static server, etc.), a bare relative path would resolve against
        // the *static preview* origin and 404. Force the conventional local API URL instead.
        if (u.startsWith('/api') && !u.startsWith('http')) {
          const base = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
            ? 'http://localhost:3000'
            : '';
          return base ? base + u : u;
        }
        return u;
      }

      function init(specUrl) {
        const el = document.getElementById('redoc');
        el.innerHTML = '';
        // Redoc will show its own error UI on 404 / network failure; we just give it a good URL.
        Redoc.init(specUrl, {
          scrollYOffset: 40,
          hideDownloadButton: false,
          expandResponses: '200,201',
          pathInMiddlePanel: true,
          theme: { colors: { primary: { main: '#20201d' } } }
        }, el);
      }

      const input = document.getElementById('spec-url');
      const btn = document.getElementById('load');
      const btnLocal = document.getElementById('btn-local');
      const btnDeployed = document.getElementById('btn-deployed');
      const btnProxy = document.getElementById('btn-proxy');

      function loadUrl(u) {
        // Use exactly what the caller put in the box (supports explicit relative for proxy case).
        input.value = u;
        init(u);
        try { history.replaceState(null, '', '?spec=' + encodeURIComponent(u)); } catch {}
      }

      function loadFromInput() {
        const u = input.value.trim() || defaultSpecUrl();
        loadUrl(u);
      }

      btn.addEventListener('click', loadFromInput);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadFromInput(); });

      if (btnLocal) btnLocal.addEventListener('click', () => {
        loadUrl(LOCAL_SPEC);
      });
      if (btnDeployed) btnDeployed.addEventListener('click', () => {
        loadUrl(DEPLOYED_SPEC);
      });
      if (btnProxy) btnProxy.addEventListener('click', () => {
        loadUrl('/api/v1/openapi.json');
      });

      // init — use getSafeInitialUrl so Live Server / static / file:// previews don't
      // auto-attempt a relative /api against the wrong origin (the classic 5501 404).
      const params = new URLSearchParams(location.search);
      const fromQuery = params.get('spec');
      const initial = getSafeInitialUrl(fromQuery);
      input.value = initial;
      // slight delay so Redoc script is ready
      setTimeout(() => init(initial), 120);
    </script>
  </body>
</html>
