name: PlugForge Final Submission

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: plugforge-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submission:
    name: Final submission gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ship
          POSTGRES_PASSWORD: ship_dev_password
          POSTGRES_DB: ship_test_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ship -d ship_test_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ship:ship_dev_password@localhost:5432/ship_test_audit
      TTFE_DATABASE_URL: postgresql://ship:ship_dev_password@localhost:5432/ship_test_audit
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Final submission gate (everything)
        run: pnpm plugforge:submission

      - name: Upload metric artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugforge-metrics
          path: my-docs/evidence/plugforge-metrics-ci/**
          if-no-files-found: warn
