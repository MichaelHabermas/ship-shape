              type: string
              enum:
                - edit_content
            content:
              $ref: "#/components/schemas/TipTapDocument"
          required:
            - type
            - content
        - type: object
          properties:
            type:
              type: string
              enum:
                - convert
            target_type:
              type: string
              enum:
                - issue
                - project
          required:
