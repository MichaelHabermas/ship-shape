  /ai/analyze-plan:
    post:
      tags:
        - AI
      summary: Analyze weekly plan quality
      description: Evaluates plan items for verifiability (falsifiability) and workload. Returns per-item scores and feedback. Advisory only — does not block plan submission.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 50000
                  description: Plain text content extracted from the weekly plan
              required:
                - content
      responses:
        200:
          description: Plan analysis result or analysis error
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/PlanAnalysisResult"
                  - $ref: "#/components/schemas/AiAnalysisError"
        429:
          description: Rate limit exceeded (max 10 per hour)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiRateLimitError"
  /ai/analyze-retro:
    post:
      tags:
        - AI
      summary: Analyze weekly retro quality
      description: Compares retro against plan for coverage and evidence. Returns per-item mapping and suggestions. Advisory only — does not block retro submission.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                retro_content:
                  type: string
                  minLength: 1
                  maxLength: 50000
                  description: Plain text content extracted from the weekly retro
                plan_content:
                  type: string
                  minLength: 1
                  maxLength: 50000
                  description: Plain text content extracted from the weekly plan for comparison
              required:
                - retro_content
                - plan_content
      responses:
        200:
          description: Retro analysis result or analysis error
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/RetroAnalysisResult"
                  - $ref: "#/components/schemas/AiAnalysisError"
        429:
          description: Rate limit exceeded (max 10 per hour)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiRateLimitError"
