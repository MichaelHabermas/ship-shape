    post:
      tags:
        - Standups
      summary: Create standup (idempotent)
      security:
      description: Create a standalone standup for the current user on a given date. Returns existing standup if one already exists for that date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStandup"
      responses:
        200:
          description: Existing standup returned (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Standup"
        201:
          description: New standup created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Standup"
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandupLegacyError"
    get:
      tags:
        - Standups
      summary: List standups for current user
      security:
      description: Get standups for the current user within a date range.
      parameters:
        - schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: Start date (YYYY-MM-DD)
            example: 2025-01-30
          required: true
          name: date_from
          in: query
        - schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            description: End date (YYYY-MM-DD)
            example: 2025-01-30
          required: true
          name: date_to
          in: query
      responses:
        200:
          description: List of standups in the date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandupsList"
        400:
          description: Missing required date_from or date_to params
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandupLegacyError"
